name: supply-chain-w10-day-b

on:
  push:
    paths:
      - "cloud/w10/day-b/ci-trivy/**"
      - ".github/workflows/supply-chain-w10-day-b.yml"
  pull_request:
    paths:
      - "cloud/w10/day-b/ci-trivy/**"
      - ".github/workflows/supply-chain-w10-day-b.yml"

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless OIDC

env:
  IMAGE: ghcr.io/taitri2004/w10-app

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" cloud/w10/day-b/ci-trivy

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: cloud/w10/day-b/ci-trivy/.trivyignore

      # Push + ký chỉ khi merge vào main (PR chỉ scan)
      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign (theo digest)
        if: github.event_name == 'push'
        env:
          COSIGN_YES: "true"
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          cosign sign "$DIGEST"
