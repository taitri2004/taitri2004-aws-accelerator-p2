name: validate-w10-day-a

on:
  pull_request:
    paths:
      - "cloud/w10/day-a/rbac/**"
      - "cloud/w10/day-a/policies/**"
      - ".github/workflows/validate-w10-day-a.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSLo kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kc.tgz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        # -ignore-missing-schemas: Gatekeeper CRD (ConstraintTemplate,
        # K8sRequiredLabels, ...) không có schema công khai -> skip an toàn.
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            cloud/w10/day-a/rbac/ \
            cloud/w10/day-a/policies/
