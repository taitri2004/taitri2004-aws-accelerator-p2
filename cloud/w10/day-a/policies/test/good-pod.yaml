# Pod tuân thủ cả 4 constraint — phải được admit:
#  - image pin tag cụ thể
#  - có cpu + memory limit
#  - runAsNonRoot: true + drop mọi capability
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: w10-demo
  labels:
    team: platform
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: nginxinc/nginx-unprivileged:1.27-alpine
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 20m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      # readOnlyRootFilesystem chặn ghi rootfs -> mount emptyDir cho các path
      # nginx cần ghi runtime (cache, pid, temp). Đây là pattern chuẩn khi
      # vừa muốn read-only rootfs vừa chạy nginx.
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
  volumes:
    - name: tmp
      emptyDir: {}
    - name: nginx-cache
      emptyDir: {}
    - name: nginx-run
      emptyDir: {}
