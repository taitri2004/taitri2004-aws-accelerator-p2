# Template: pod/container phải chạy non-root (runAsNonRoot: true).
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirerunasnonroot
spec:
  crd:
    spec:
      names:
        kind: K8sRequireRunAsNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirenonroot

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not container_nonroot(container)
          msg := sprintf("container <%v> phải chạy non-root (set securityContext.runAsNonRoot: true)", [container.name])
        }

        # Pass nếu set ở pod-level hoặc container-level
        container_nonroot(c) {
          c.securityContext.runAsNonRoot == true
        }
        container_nonroot(c) {
          input.review.object.spec.securityContext.runAsNonRoot == true
        }
