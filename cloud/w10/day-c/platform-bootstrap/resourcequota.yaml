# Hạn mức TỔNG cho namespace: chặn một team ăn hết cluster.
# Khi đã đặt quota cpu/memory -> mọi pod BUỘC phải khai báo request/limit
# (nếu không sẽ bị từ chối) -> LimitRange cấp default để pod không vỡ.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quota
  namespace: platform-app
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    count/deployments.apps: "10"
    secrets: "20"
    services.loadbalancers: "2"
