# Local/offline demo: đọc từ fake-store, ghi vào Secret K8s `app-secret`.
# Cùng target `app-secret` như bản AWS -> consumer không cần đổi gì.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: w10-secrets
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: fake-store
    kind: ClusterSecretStore
  target:
    name: app-secret
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: prod/app/db_password
