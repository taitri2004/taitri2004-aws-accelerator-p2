# Local/offline demo: provider `fake` giữ giá trị inline, không cần AWS.
# Dùng để minh hoạ cơ chế ESO + rotation khi không có EKS/IRSA.
# Rotate = sửa `value` (và `version`) rồi apply lại file này.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: fake-store
spec:
  provider:
    fake:
      data:
        - key: prod/app/db_password
          value: v1-rotate-me
          version: v1
