# Production path: lấy property từ secret JSON trong AWS Secrets Manager,
# ghi vào Secret K8s `app-secret`. refreshInterval ngắn để rotation nhanh.
# (Áp dụng MỘT trong hai: externalsecret-aws.yaml HOẶC externalsecret-fake.yaml.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: w10-secrets
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: app-secret
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: prod/app
        property: db_password
