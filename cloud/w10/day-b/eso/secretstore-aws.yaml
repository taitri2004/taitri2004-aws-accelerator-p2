# Production path: ESO đọc AWS Secrets Manager, auth bằng IRSA (không access key).
# Yêu cầu: chạy trên EKS, ServiceAccount eso-irsa gắn IAM role có quyền
# secretsmanager:GetSecretValue.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-irsa
            namespace: w10-secrets
