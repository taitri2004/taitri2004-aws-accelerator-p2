# Application mẫu trỏ tới repo demo chính thức của Argo CD.
# Dùng minh hoạ luồng GitOps cơ bản: ArgoCD pull manifest từ Git, apply vào
# cluster, selfHeal khi cluster drift khỏi Git.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
