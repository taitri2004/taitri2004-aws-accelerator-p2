apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: waves-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector: { app: backend }
  ports:
    - port: 5678
      targetPort: 5678
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: waves-demo
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
