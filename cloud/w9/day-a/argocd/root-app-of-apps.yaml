# App-of-Apps pattern mẫu cho lab.
# Root Application trỏ tới folder `cloud/w9/lab/apps/` trong repo này. Mỗi file
# YAML trong folder đó là một Application con (monitoring, otel, rollouts,
# demo-api...). Áp dụng root sẽ kích hoạt ArgoCD discover và sync tất cả app
# con.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: w9-lab-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/taitri2004/taitri2004-aws-accelerator-p2.git
    targetRevision: main
    path: cloud/w9/lab/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
