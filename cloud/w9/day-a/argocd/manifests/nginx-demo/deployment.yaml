# Demo Deployment cho W9-D1: ArgoCD sync từ chính repo này (taitri2004/...).
# Mục đích: chứng minh rollback bằng `git revert` — sửa replicas, commit, ArgoCD
# tự sync; revert commit, ArgoCD tự sync lại. Audit trail = `git log`.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: w9-demo
  labels: { app: nginx-demo }
spec:
  replicas: 3
  selector:
    matchLabels: { app: nginx-demo }
  template:
    metadata:
      labels: { app: nginx-demo }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
