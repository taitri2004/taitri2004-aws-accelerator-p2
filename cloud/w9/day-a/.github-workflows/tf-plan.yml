# Terraform plan-on-PR cho cloud/w8/exercise
# Trigger: PR mở/sửa file dưới cloud/w8/exercise/
# Output: comment plan vào PR cho reviewer xem trước khi merge.

name: Terraform Plan (w8 exercise)

on:
  pull_request:
    paths:
      - 'cloud/w8/exercise/**'
      - '.github/workflows/tf-plan.yml'

permissions:
  contents: read
  pull-requests: write   # cần để comment plan
  id-token: write        # cần cho OIDC → AWS

env:
  AWS_REGION: ap-southeast-1
  TF_WORKDIR: cloud/w8/exercise/environments/dev

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::749043157095:role/gha-tf-plan
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4

      - name: terraform fmt -check
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform init -input=false

      - name: terraform validate
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform validate

      - name: terraform plan
        id: plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          terraform plan -no-color -input=false -out=tf.plan 2>&1 | tee plan.txt
          echo "exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKDIR }}/plan.txt', 'utf8');
            const body = [
              '### Terraform Plan — `${{ env.TF_WORKDIR }}`',
              '',
              '<details><summary>Click to expand</summary>',
              '',
              '```hcl',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan,
              '```',
              '',
              '</details>'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exit != '0'
        run: exit 1
