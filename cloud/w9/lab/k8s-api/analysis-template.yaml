apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: api
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 20s
      count: 5
      successCondition: result[0] >= 0.95
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring:9090
          query: |
            sum(rate(flask_http_request_total{
              namespace="api", service="{{args.service-name}}", status!~"5.."}[1m]))
            /
            sum(rate(flask_http_request_total{
              namespace="api", service="{{args.service-name}}"}[1m]))
