apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: web
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  MESSAGE: "hello from gitops lab"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: web
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: web-config
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: web
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
