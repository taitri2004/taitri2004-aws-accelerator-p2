# PrometheusRule: SLO recording rules + multi-window multi-burn-rate alerts.
#
# SLO mục tiêu cho demo: 99% request thành công (không phải 5xx).
#   => error budget = 1 - 0.99 = 0.01
#
# Multi-window burn rate (theo Google SRE Workbook):
#   - Fast page: long 1h AND short 5m,  burn rate 14.4x  (tiêu 2% budget/1h)
#   - Slow page: long 6h AND short 30m, burn rate 6x     (tiêu 5% budget/6h)
# Hai cửa sổ cùng phải vượt ngưỡng mới fire => giảm noise + reset nhanh.
#
# Metric nguồn: http_request_duration_seconds_count của podinfo, có label
# `status`. Lỗi = status bắt đầu bằng 5.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: podinfo-slo
  namespace: demo
  labels:
    app: podinfo
    release: kube-prometheus-stack
spec:
  groups:
    - name: podinfo-slo-recording
      interval: 30s
      rules:
        - record: job:slo_errors:ratio_rate5m
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="demo",status=~"5.."}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="demo"}[5m]))
        - record: job:slo_errors:ratio_rate30m
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="demo",status=~"5.."}[30m]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="demo"}[30m]))
        - record: job:slo_errors:ratio_rate1h
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="demo",status=~"5.."}[1h]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="demo"}[1h]))
        - record: job:slo_errors:ratio_rate6h
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="demo",status=~"5.."}[6h]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="demo"}[6h]))

    - name: podinfo-slo-alerts
      rules:
        - alert: PodinfoErrorBudgetBurnFast
          expr: |
            job:slo_errors:ratio_rate1h > (14.4 * 0.01)
            and
            job:slo_errors:ratio_rate5m > (14.4 * 0.01)
          for: 2m
          labels:
            severity: page
            slo: podinfo-availability
          annotations:
            summary: "Podinfo đốt error budget nhanh (burn rate > 14.4x)"
            description: "Tỉ lệ lỗi 1h và 5m đều vượt 14.4x budget. Sẽ cạn budget 30 ngày trong ~2 ngày nếu tiếp diễn."

        - alert: PodinfoErrorBudgetBurnSlow
          expr: |
            job:slo_errors:ratio_rate6h > (6 * 0.01)
            and
            job:slo_errors:ratio_rate30m > (6 * 0.01)
          for: 15m
          labels:
            severity: page
            slo: podinfo-availability
          annotations:
            summary: "Podinfo đốt error budget chậm (burn rate > 6x)"
            description: "Tỉ lệ lỗi 6h và 30m đều vượt 6x budget."
